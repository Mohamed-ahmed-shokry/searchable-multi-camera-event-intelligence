name: ci

# Phase CI-0 contract: sync the locked environment, lint, format-check, test.
# Windows runner because it matches the development OS where OpenCV MJPG
# VideoWriter fixtures were verified (see docs/ROADMAP.md decision log).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked default environment (numpy, opencv, pytest, ruff)
        run: uv sync --locked

      - name: Lint (rust-style, errors on warnings-by-config)
        run: uv run --locked ruff check .

      - name: Format check
        run: uv run --locked ruff format --check .

      - name: Run full test suite
        run: uv run --locked pytest -v
