[project]
name = "searchable-multi-camera-event-intelligence"
version = "0.1.0"
description = "Reproducible computer vision experiments for searchable camera event intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.6",
    "opencv-python==4.13.0.92",
]

[project.optional-dependencies]
detection-cpu = [
    "lap==0.5.13",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ultralytics==8.4.132",
]
detection-cuda = [
    "lap==0.5.13",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ultralytics==8.4.132",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
notebooks = ["jupyter==1.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ extra = "detection-cpu" }, { extra = "detection-cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "detection-cpu" },
    { index = "pytorch-cu128", extra = "detection-cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "detection-cpu" },
    { index = "pytorch-cu128", extra = "detection-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
